name: Build LaTex PDFs

on:
  push:
    paths:
      - "**.tex"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTex
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: latest
          args: -pdf -interaction=nonstopmode -file-line-error
      
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: main.pdf

      - name: Move PDF to pdf/
        run: |
          mkdir -p pdf
          mv -f main.pdf pdf/

      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pdf/main.pdf
          git commit -m "Auto-build PDF [skip ci]" || { echo "No changes to commit"; exit 0; }
          git push
